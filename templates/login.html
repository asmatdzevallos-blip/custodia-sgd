<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custodia — Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root{
            --ink:#1C2B3A;
            --ink-soft:#3B4A5A;
            --paper:#F3F1EA;
            --paper-raised:#FFFFFF;
            --line:#DAD5C7;
            --accent:#7A2430;
            --success-soft:#E6EDE7;
            --danger-soft:#F3E3DF;
            --muted:#6B6659;
        }
        body{
            background:var(--paper);
            color:var(--ink);
            font-family:'IBM Plex Sans', sans-serif;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:16px;
        }
        .caja{
            width:100%;
            max-width:380px;
            background:var(--paper-raised);
            border:1px solid var(--line);
            border-top:3px solid var(--accent);
            border-radius:6px;
            padding:28px 26px;
        }
        .marca{
            font-family:'Source Serif 4', serif;
            font-weight:600;
            font-size:26px;
        }
        .descripcion{ font-size:13px; color:var(--muted); margin-bottom:22px; }
        .form-label{ font-size:13px; font-weight:500; color:var(--ink-soft); margin-bottom:4px; }
        .form-control{ border:1px solid var(--line); border-radius:4px; padding:9px 12px; font-size:14px; }
        .form-control:focus{ border-color:var(--ink-soft); box-shadow:0 0 0 3px rgba(28,43,58,0.08); }
        .btn-primario{
            background:var(--ink); color:var(--paper); border:none; border-radius:4px;
            padding:10px 16px; font-weight:500; font-size:14px;
        }
        .btn-primario:hover{ background:var(--ink-soft); color:var(--paper); }
        .alerta{ border:1px solid var(--line); border-radius:5px; padding:10px 14px; font-size:13.5px; margin-bottom:16px; }
        .alerta-success{ background:var(--success-soft); color:#264632; }
        .alerta-danger{ background:var(--danger-soft); color:#6B2A20; }
        .alerta-warning{ background:#F6EFD8; color:#6B5610; }
    </style>
</head>
<body>

<div class="caja">
    <div class="marca">Custodia</div>
    <div class="descripcion">Gestión documental para estudios jurídicos</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alerta alerta-{{ category }}">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="mb-3">
            <label class="form-label" for="email">Correo</label>
            <input type="email" id="email" name="email" class="form-control" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
            <label class="form-label" for="password">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn-primario w-100">Iniciar sesión</button>
    </form>
</div>

</body>
</html>
